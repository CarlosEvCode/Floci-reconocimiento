<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Rekognition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
        }

        .header {
            font-size: 0.9rem;
            color: #58a6ff;
            margin-bottom: 20px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }

        .prompt {
            color: #7ee787;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        input[type="file"] {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 6px;
            color: #8b949e;
            font-size: 0.85rem;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            font-family: inherit;
        }

        input[type="file"]::file-selector-button:hover {
            background: #30363d;
        }

        button {
            background: #238636;
            color: #fff;
            border: 1px solid rgba(240, 246, 252, 0.1);
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
        }

        button:hover {
            background: #2ea043;
        }

        button:disabled {
            background: #21262d;
            color: #6e7681;
            cursor: not-allowed;
        }

        .results {
            border-top: 1px solid #30363d;
            padding-top: 16px;
        }

        .results h3 {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        li {
            background: #0d1117;
            border: 1px solid #21262d;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label-name {
            color: #79c0ff;
        }

        .confidence {
            color: #7ee787;
            font-weight: 600;
        }

        .status-msg {
            color: #8b949e;
            font-size: 0.85rem;
        }

        .error-msg {
            color: #f85149;
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.3);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="prompt">$</span> aws rekognition detect-labels
        </div>

        <form id="uploadForm">
            <input type="file" name="imagen" id="imagen" accept="image/*" required>
            <button type="submit" id="btnSubmit">Analizar Imagen</button>
        </form>

        <div class="results">
            <h3>Resultados</h3>
            <ul id="listaEtiquetas">
                <li class="status-msg">Seleccione una imagen y haga clic en Analizar.</li>
            </ul>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm')
        const fileInput = document.getElementById('imagen')
        const btnSubmit = document.getElementById('btnSubmit')
        const listaEtiquetas = document.getElementById('listaEtiquetas')

        form.addEventListener('submit', async (e) => {
            e.preventDefault()

            if (!fileInput.files[0]) return

            const formData = new FormData(form)
            btnSubmit.disabled = true
            listaEtiquetas.innerHTML = `<li class="status-msg">Procesando con AWS Rekognition...</li>`

            try {
                const response = await fetch('/api/analizar', {
                    method: 'POST',
                    body: formData
                })

                const data = await response.json()
                btnSubmit.disabled = false

                if (data.success && Array.isArray(data.labels)) {
                    listaEtiquetas.innerHTML = ''
                    if (data.labels.length === 0) {
                        listaEtiquetas.innerHTML = `<li class="status-msg">No se detectaron etiquetas.</li>`
                        return
                    }

                    data.labels.forEach(label => {
                        const li = document.createElement('li')
                        const confidence = Number(label.Confidence).toFixed(1)
                        li.innerHTML = `
                            <span class="label-name">${label.Name}</span>
                            <span class="confidence">${confidence}%</span>
                        `
                        listaEtiquetas.appendChild(li)
                    })
                } else {
                    listaEtiquetas.innerHTML = `<li class="error-msg">${data.error || 'Error al procesar la imagen'}</li>`
                }
            } catch (error) {
                console.error(error)
                btnSubmit.disabled = false
                listaEtiquetas.innerHTML = `<li class="error-msg">Error de conexión con el servidor.</li>`
            }
        })
    </script>
</body>
</html>
