<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Analizando archivos con AWS</h1>
    <form id="uploadForm">
        <div>
            <label for="imagen">Selecciona una imagen:</label>
            <input type="file" name="imagen" id="imagen" accept="image/*" required>
        </div>
        <button type="submit">Subir Imagen</button>
    </form>

    <div>
        <h3>Resultados del análisis</h3>
        <ul id="listaEtiquetas"></ul>
    </div>

    <script>
        const form = document.getElementById('uploadForm')
        const listaEtiquetas = document.getElementById('listaEtiquetas')

        form.addEventListener('submit', async(e) => {
            e.preventDefault() //Detenemos el envio

            //FormData = contenedor de datos
            const formData = new FormData(form)

            listaEtiquetas.innerHTML = `<li>Analizando imagen con AWS...</li>`

            //Enviar los datos por el API
            try{
                const response = await fetch('/api/analizar', {
                    method: 'POST',
                    body: formData
                })
                //El servicio aws inicia la resolucion...
                
                const data = await response.json()

                if (data.success){
                    listaEtiquetas.innerHTML = ``
                    data.labels.forEach(label => {
                        const li = document.createElement('li')
                        li.innerHTML = `Imagen: ${label.Name} - confianza: ${label.Confidence}%`
                        listaEtiquetas.appendChild(li)
                    })
                } else {
                    //Cuidado: no se deben exponer todos los errores
                    //¿Cómo se manejan los errores en backend?
                    listaEtiquetas.innerHTML = `
                    <li>${data.error}</li>
                    <li>${data.details}</li>
                    <li>${data.code}</li>
                    
                    `
                }

            } catch (error) {
                console.error(error)
                listaEtiquetas.innerHTML = `<li>Error de conexion</li>`
            }
        })
    </script>
</body>
</html>
